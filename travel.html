<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1730" />
  <meta http-equiv="Cache-Control" content="no-store, max-age=0" />
  <title>Virtual Journey · Medora Travel</title>
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="travel-journey.css?v=4.1.0" />
  <link rel="stylesheet" href="travel-journey-controls-v4.css?v=4.1.0" />
  <link rel="stylesheet" href="travel-place-info.css?v=4.1.0" />
  <script>
    if (new URLSearchParams(location.search).get('embedded') === '1') {
      document.documentElement.classList.add('embedded');
    }
  </script>
  <style>
    .embedded .journey-top{display:none}
    .embedded .journey-app{padding-top:0}
  </style>
</head>
<body>
  <div id="journeyToast" class="journey-toast" role="status" aria-live="polite"></div>
  <div id="journeyLoading" class="journey-loading">
    <div><img src="assets/medora-mark.svg" alt=""><strong>Building your private virtual journey…</strong></div>
  </div>
  <main id="journeyRoot" class="journey-app hidden"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
  <script src="travel-runtime.js?v=4.1.0"></script>
  <script src="travel-journey-v4.js?v=4.1.0" onerror="window.__MEDORA_TRAVEL_RUNTIME_ERROR__ && window.__MEDORA_TRAVEL_RUNTIME_ERROR__('The Virtual Journey script failed to load.')"></script>
  <script src="travel-place-info.js?v=4.1.0"></script>
</body>
</html>
