<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1730" />
  <meta http-equiv="Cache-Control" content="no-store, max-age=0" />
  <title>Virtual Journey · Medora Travel</title>
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="travel-journey.css?v=4.6.0" />
  <link rel="stylesheet" href="travel-journey-controls-v4.css?v=4.6.0" />
  <link rel="stylesheet" href="travel-place-info.css?v=4.6.0" />
  <link rel="stylesheet" href="travel-step-builder-v4.4.css?v=4.6.0" />
  <link rel="stylesheet" href="travel-photo-drop-v4.5.css?v=4.6.0" />
  <link rel="stylesheet" href="travel-smart-entities-v4.6.css?v=4.6.0" />
  <style>
    .embedded .journey-top{display:none}
    .embedded .journey-app{padding-top:0}
    .journey-modal{width:min(960px,calc(100vw - 32px))!important;padding:34px!important;border-radius:28px!important}
    .journey-modal.wide{width:min(1080px,calc(100vw - 32px))!important}
    .jm-head{gap:20px!important}
    .jm-head .step-type{font-size:12px!important;line-height:1.3!important;letter-spacing:.14em!important}
    .jm-head h2{margin:8px 0 0!important;font-size:36px!important;line-height:1.08!important;letter-spacing:-.045em!important}
    .jm-head p{margin:9px 0 0!important;font-size:16px!important;line-height:1.5!important;color:#718096!important}
    .jm-x{width:48px!important;height:48px!important;flex:0 0 48px!important;font-size:27px!important}
    .jm-form{gap:18px!important;margin-top:24px!important}
    .jm-grid2,.jm-grid3{gap:16px!important}
    .jm-form label{gap:9px!important;font-size:15px!important;line-height:1.35!important;font-weight:800!important;color:#4f5e77!important}
    .jm-form input,.jm-form select,.jm-form textarea{min-height:58px!important;padding:14px 16px!important;border-radius:15px!important;font-size:17px!important;font-weight:600!important;line-height:1.35!important;color:#17213a!important}
    .jm-form input::placeholder,.jm-form textarea::placeholder{font-size:16px!important;color:#8a95a7!important;opacity:1!important}
    .jm-form textarea{min-height:116px!important}
    .jm-actions{gap:12px!important;margin-top:9px!important}
    .jm-actions .jbtn{min-height:54px!important;font-size:15px!important;border-radius:14px!important}
    .jm-date-hint{display:none!important}
    .jm-date-input{font-variant-numeric:tabular-nums!important;letter-spacing:.03em!important}
    @media(max-width:650px){
      .journey-modal{padding:22px 18px!important;border-radius:22px!important}
      .jm-head h2{font-size:29px!important}
      .jm-head p{font-size:14px!important}
      .jm-form label{font-size:14px!important}
      .jm-form input,.jm-form select,.jm-form textarea{min-height:54px!important;font-size:16px!important}
      .jm-actions .jbtn{font-size:14px!important}
    }
  </style>
  <script>
    if (new URLSearchParams(location.search).get('embedded') === '1') document.documentElement.classList.add('embedded');
    (() => {
      const IDS=new Set(['npStart','npEnd','epStart','epEnd']);
      const isoToDisplay=v=>{const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:(v||'')};
      const displayToIso=v=>{const m=String(v||'').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m)return String(v||'').trim()?null:'';const d=+m[1],mo=+m[2],y=+m[3],x=new Date(Date.UTC(y,mo-1,d));return x.getUTCFullYear()===y&&x.getUTCMonth()===mo-1&&x.getUTCDate()===d?`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`:null};
      const enhance=input=>{if(!input||!IDS.has(input.id)||input.dataset.ddmmyyyy==='1')return;input.dataset.ddmmyyyy='1';const original=input.value;input.type='text';input.inputMode='numeric';input.autocomplete='off';input.maxLength=10;input.placeholder='DD/MM/YYYY';input.classList.add('jm-date-input');input.value=isoToDisplay(original);input.addEventListener('input',()=>{const x=input.value.replace(/\D/g,'').slice(0,8);input.value=x.length<=2?x:x.length<=4?`${x.slice(0,2)}/${x.slice(2)}`:`${x.slice(0,2)}/${x.slice(2,4)}/${x.slice(4)}`})};
      const scan=root=>IDS.forEach(id=>{if(root?.id===id)enhance(root);enhance(root?.querySelector?.(`#${id}`))});
      document.addEventListener('submit',event=>{const form=event.target;if(!(form instanceof HTMLFormElement))return;const inputs=[...form.querySelectorAll('.jm-date-input')];if(!inputs.length)return;const restore=[];for(const input of inputs){const shown=input.value,iso=displayToIso(shown);if(iso===null){event.preventDefault();event.stopImmediatePropagation();input.setCustomValidity('Use DD/MM/YYYY, for example 27/12/2026.');input.reportValidity();return}input.setCustomValidity('');restore.push([input,shown]);input.value=iso}setTimeout(()=>restore.forEach(([i,v])=>{if(document.contains(i))i.value=v}),0)},true);
      const start=()=>{scan(document);new MutationObserver(rs=>rs.forEach(r=>r.addedNodes.forEach(n=>{if(n instanceof Element)scan(n)}))).observe(document.body,{childList:true,subtree:true})};
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
    })();
  </script>
</head>
<body>
  <div id="journeyToast" class="journey-toast" role="status" aria-live="polite"></div>
  <div id="journeyLoading" class="journey-loading">
    <div><img src="assets/medora-mark.svg" alt=""><strong>Building your private virtual journey…</strong></div>
  </div>
  <main id="journeyRoot" class="journey-app hidden"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
  <script src="travel-runtime.js?v=4.6.0"></script>
  <script src="travel-journey-v4.js?v=4.6.0" onerror="window.__MEDORA_TRAVEL_RUNTIME_ERROR__ && window.__MEDORA_TRAVEL_RUNTIME_ERROR__('The Virtual Journey script failed to load.')"></script>
  <script src="travel-place-info.js?v=4.6.0"></script>
  <script src="travel-step-builder-v4.4.js?v=4.6.0"></script>
  <script src="travel-photo-drop-v4.5.js?v=4.6.0"></script>
  <script src="travel-smart-entities-v4.6.js?v=4.6.0"></script>
</body>
</html>
